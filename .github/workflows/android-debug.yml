name: Build Android APK de teste
on:
  workflow_dispatch:
  push:
    branches: [ main, master, alpha-0.2, fix-continuous-voice, brand-settings-commercial, camera-dialogs-041, dual-video-050 ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Manter assinatura de teste entre builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voltadolance-debug-keystore-v1
      - name: Cache do modelo offline em portugues
        uses: actions/cache@v4
        with:
          path: .models/
          key: vosk-pt-small-0.3-6e1ce909
      - name: Preparar audio de teste sintetico em portugues
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          bash scripts/prepare-test-audio.sh
      - name: Executar testes unitários
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Gerar APK de teste
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar assinatura e versão do APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1
      - name: Habilitar aceleracao do Android de teste
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar instalacao limpa, reinstalacao e abertura no Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            bash scripts/check-android.sh
      - name: Publicar APK na aba Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoltaDoLance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoltaDoLance-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            install-results/
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VoltaDoLance-debug-apk
          path: apk
      - name: Publicar APK direto para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: alpha-0.4.1-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          mv apk/app-debug.apk apk/LanceVivo-0.4.1-alpha.apk
          gh release create "$BUILD_TAG" apk/LanceVivo-0.4.1-alpha.apk --target "$BUILD_SHA" --prerelease --title "LanceVivo 0.4.1 alpha" --notes "Seletores padronizados nos temas claro/escuro, icone de galeria reconhecivel e troca traseira/frontal com qualidade compativel e recuperacao de falha. Captura continua e frases exatas preservadas. Planos apenas demonstrativos, sem cobranca. Validacao fisica no OPPO ainda necessaria."
